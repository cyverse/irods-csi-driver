# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

controllerService:
  replicaCount: 2

  nodeSelector:
    kubernetes.io/os: linux

  podSecurityContext: {}

  irodsPlugin:
    image:
      repository: cyverse/irods-csi-driver
      tag: v0.12.0
      pullPolicy: Always

    extraArgs:
      - --logtostderr
      - --v=5

    securityContext:
      privileged: true
      capabilities:
        add: ["SYS_ADMIN"]

    resources: {}

  csiProvisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v3.1.0
      pullPolicy: IfNotPresent

    extraArgs:
      - --timeout=5m
      - --v=5
      - --leader-election

    securityContext: {}

    resources: {}

nodeService:
  podSecurityContext: {}

  nodeSelector:
    kubernetes.io/os: linux

  irodsPlugin:
    image:
      repository: cyverse/irods-csi-driver
      tag: v0.12.0
      pullPolicy: Always

    irodsfsdEndpoint: tcp://127.0.0.1:13020

    extraArgs:
      - --logtostderr
      - --v=5

    securityContext:
      privileged: true
      capabilities:
        add: ["SYS_ADMIN"]

    resources: {}

  csiDriverRegistrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.9.1
      pullPolicy: IfNotPresent

    extraArgs:
      - --v=5

    securityContext: {}

    resources: {}

  livenessProbe:
    image:
      repository: registry.k8s.io/sig-storage/livenessprobe
      tag: v2.11.0
      pullPolicy: IfNotPresent

    resources: {}

nameOverride: ""
fullnameOverride: ""
kubeletDir: /var/lib/kubelet
# for k0s
#kubeletDir: /var/lib/k0s/kubelet

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  annotations: {}
  name: irods-csi-controller-sa

globalConfig:
  secret:
    stringData: {}
