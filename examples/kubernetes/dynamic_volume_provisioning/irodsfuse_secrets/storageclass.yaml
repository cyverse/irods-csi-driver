kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: irods-sc # the name of the SC
provisioner: irods.csi.cyverse.org
parameters:
  client: "irodsfuse" # iRODS client
  host: "data.cyverse.org"  # iRODS host 
  port: "1247" # iRODS port
  zone: "iplant" # iRODS zone name
  volumeRootPath: "/iplant/home/my_username" # iRODS path to create a sub-directory and mount
  csi.storage.k8s.io/provisioner-secret-name: "my-secret"
  csi.storage.k8s.io/provisioner-secret-namespace: "default"
  csi.storage.k8s.io/node-stage-secret-name: "my-secret"
  csi.storage.k8s.io/node-stage-secret-namespace: "default"
