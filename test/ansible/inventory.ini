; iRODS CSI Driver test cluster inventory
; Nodes are reached over SSH via public IP (ansible_host), but k3s is
; configured so node-to-node cluster traffic uses each node's internal IP
; (internal_ip). The master node is tainted so that it does not run regular
; workloads (it is not configured as a worker).

[k3s_master]
128.196.65.15 node_name=master internal_ip=172.16.6.79

[k3s_worker]
128.196.65.82 node_name=worker1 internal_ip=172.16.6.81
128.196.65.31 node_name=worker2 internal_ip=172.16.6.93

[irodsfs_pool]
128.196.65.15 node_name=pool internal_ip=172.16.6.79

[k3s_cluster:children]
k3s_master
k3s_worker

[k3s_cluster:vars]
; SSH user used to log into every node. Change this to match your VMs.
ansible_user=ubuntu
; Uncomment and adjust if you use a non-default SSH key.
;ansible_ssh_private_key_file=~/.ssh/id_rsa
; Nodes are addressed by public IP directly, so ansible_host == inventory_hostname.
