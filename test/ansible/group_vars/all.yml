---
# Pin a specific k3s version, e.g. "v1.29.4+k3s1". Leave empty for latest stable.
k3s_version: ""

# NodePort range k3s uses by default, opened on all nodes for test workloads.
k3s_nodeport_range: "30000:32767"

# iRODS CSI Driver Helm installation settings.
csi_release_name: irods-csi-driver
csi_namespace: irods-csi-driver
csi_chart_package: "{{ playbook_dir }}/../../irods-csi-driver-0.12.0.tgz"
# Ansible searches test/ansible/files/ for this file by default.
csi_values_file: user_values.yaml
csi_helm_timeout: 10m
# Pin the Helm client version for reproducible test-cluster setup.
csi_helm_version: v3.17.3
csi_package_directory: /tmp/irods-csi-driver-helm
csi_chart_remote_path: "{{ csi_package_directory }}/{{ csi_chart_package | basename }}"
csi_values_remote_path: "{{ csi_package_directory }}/values.yaml"
# Applied to inventory members in k3s_worker before the chart is installed.
csi_worker_node_label_key: irods.csi.cyverse.org/worker
csi_worker_node_label_value: "true"
