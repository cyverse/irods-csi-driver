---
# Installs the Helm package generated by `make helm` on the k3s master.
#
# The package and, optionally, a values file are copied from the Ansible
# control machine.  Override the defaults with -e, for example:
#   ansible-playbook csi_install.yml \
#     -e csi_chart_package=/path/to/irods-csi-driver-0.12.1.tgz \
#     -e csi_values_file=/path/to/values.yaml

- name: Install iRODS CSI Driver Helm package
  hosts: k3s_master
  become: true
  pre_tasks:
    - name: Verify that the Helm package exists on the control machine
      ansible.builtin.stat:
        path: "{{ csi_chart_package }}"
      delegate_to: localhost
      become: false
      register: csi_chart_package_stat
      run_once: true

    - name: Stop when the Helm package is missing
      ansible.builtin.assert:
        that: csi_chart_package_stat.stat.exists
        fail_msg: >-
          Helm package {{ csi_chart_package }} was not found. Run `make helm`
          first, or set csi_chart_package with -e.
      delegate_to: localhost
      become: false
      run_once: true

    - name: Verify that Helm is installed on the k3s master
      ansible.builtin.command:
        argv:
          - helm
          - version
          - --short
      register: csi_helm_version_check
      changed_when: false
      failed_when: false

    - name: Select the Helm binary architecture
      ansible.builtin.set_fact:
        csi_helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'arm'}.get(ansible_architecture, ansible_architecture) }}"
      when: csi_helm_version_check.rc != 0

    - name: Validate the Helm binary architecture
      ansible.builtin.assert:
        that: csi_helm_arch in ['amd64', 'arm64', 'arm']
        fail_msg: >-
          No Helm Linux binary mapping is configured for {{ ansible_architecture }}.
          Install Helm manually or extend the csi_helm_arch mapping.
      when: csi_helm_version_check.rc != 0

    - name: Create a temporary directory for the Helm download
      ansible.builtin.file:
        path: "/tmp/helm-{{ csi_helm_version }}-{{ csi_helm_arch }}"
        state: directory
        mode: "0755"
      when: csi_helm_version_check.rc != 0

    - name: Download Helm when it is not installed
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ csi_helm_version }}-linux-{{ csi_helm_arch }}.tar.gz"
        dest: "/tmp/helm-{{ csi_helm_version }}-{{ csi_helm_arch }}/helm.tar.gz"
        mode: "0644"
      when: csi_helm_version_check.rc != 0

    - name: Extract the Helm binary
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ csi_helm_version }}-{{ csi_helm_arch }}/helm.tar.gz"
        dest: "/tmp/helm-{{ csi_helm_version }}-{{ csi_helm_arch }}"
        remote_src: true
        creates: "/tmp/helm-{{ csi_helm_version }}-{{ csi_helm_arch }}/linux-{{ csi_helm_arch }}/helm"
      when: csi_helm_version_check.rc != 0

    - name: Install the Helm binary
      ansible.builtin.copy:
        src: "/tmp/helm-{{ csi_helm_version }}-{{ csi_helm_arch }}/linux-{{ csi_helm_arch }}/helm"
        dest: /usr/local/bin/helm
        remote_src: true
        mode: "0755"
      when: csi_helm_version_check.rc != 0

  tasks:
    - name: Create a directory for the Helm package
      ansible.builtin.file:
        path: "{{ csi_package_directory }}"
        state: directory
        mode: "0755"

    - name: Copy the iRODS CSI Driver Helm package to the k3s master
      ansible.builtin.copy:
        src: "{{ csi_chart_package }}"
        dest: "{{ csi_chart_remote_path }}"
        mode: "0644"

    - name: Render the optional Helm values file on the k3s master
      ansible.builtin.template:
        src: "{{ csi_values_file }}"
        dest: "{{ csi_values_remote_path }}"
        mode: "0600"
      when: csi_values_file | length > 0

    - name: Install or upgrade the iRODS CSI Driver
      ansible.builtin.command:
        argv: "{{
          ['helm', 'upgrade', '--install', csi_release_name, csi_chart_remote_path,
           '--namespace', csi_namespace, '--create-namespace', '--wait', '--atomic',
           '--timeout', csi_helm_timeout]
          + (['--values', csi_values_remote_path] if csi_values_file | length > 0 else [])
        }}"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: csi_helm_install
      changed_when: >-
        'has been upgraded' in csi_helm_install.stdout or
        'has been installed' in csi_helm_install.stdout

    - name: Show installed CSI Driver release
      ansible.builtin.command:
        argv:
          - helm
          - status
          - "{{ csi_release_name }}"
          - --namespace
          - "{{ csi_namespace }}"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
