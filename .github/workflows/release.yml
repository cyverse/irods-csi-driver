name: Release iRODS CSI Driver

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: Package Helm chart and container image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: cyverse/irods-csi-driver
    steps:
      - uses: actions/checkout@v7

      - name: Validate release and chart versions
        shell: bash
        run: |
          chart_version="$(awk '/^version:/{print $2; exit}' helm/Chart.yaml)"
          expected_tag="v${chart_version}"
          test "${GITHUB_REF_NAME}" = "${expected_tag}" || {
            echo "Release tag must be ${expected_tag}, matching helm/Chart.yaml."
            exit 1
          }

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and package Helm chart
        run: |
          helm lint helm
          helm package helm --destination dist

      - name: Attach Helm chart to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/irods_csi_driver_image.dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
